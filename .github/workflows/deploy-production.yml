name: Publicar em producao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar testes
        run: mvn --batch-mode test

  producao:
    name: Publicar na AWS
    needs: testes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar codigo aprovado nos testes
        uses: actions/checkout@v4
      - name: Preparar acesso seguro a AWS
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copiar codigo sem segredos
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='target/' \
            --exclude='postgres-data/' \
            --exclude='outputs/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            ./ "ubuntu@$AWS_HOST:~/vagaradar-ai/"
      - name: Recriar aplicacao e validar saude
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "ubuntu@$AWS_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd ~/vagaradar-ai
            docker compose -f compose.yaml -f compose.oracle.yaml up -d --build

            app_id="$(docker compose -f compose.yaml -f compose.oracle.yaml ps -q app)"
            test -n "$app_id"
            for tentativa in $(seq 1 18); do
              estado="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$app_id")"
              if [ "$estado" = "healthy" ]; then
                exit 0
              fi
              sleep 5
            done

            docker compose -f compose.yaml -f compose.oracle.yaml logs --tail=100 app
            echo 'A aplicacao nao ficou saudavel dentro do prazo.' >&2
            exit 1
          REMOTE
