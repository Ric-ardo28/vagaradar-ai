services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vagaradar
      POSTGRES_USER: ${DATABASE_USERNAME:-vagaradar}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vagaradar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vagaradar
      DATABASE_USERNAME: ${DATABASE_USERNAME:-vagaradar}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vagaradar}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MINIMUM_SCORE: ${DISCORD_MINIMUM_SCORE:-70}
      DISCORD_OUTBOX_ENABLED: ${DISCORD_OUTBOX_ENABLED:-true}
      DISCORD_OUTBOX_FIXED_DELAY: ${DISCORD_OUTBOX_FIXED_DELAY:-PT30S}
      DISCORD_OUTBOX_INITIAL_DELAY: ${DISCORD_OUTBOX_INITIAL_DELAY:-PT10S}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_OAUTH_ENABLED: ${GMAIL_OAUTH_ENABLED:-false}
      GMAIL_SCHEDULER_ENABLED: ${GMAIL_SCHEDULER_ENABLED:-false}
      GMAIL_SCHEDULER_FIXED_DELAY: ${GMAIL_SCHEDULER_FIXED_DELAY:-PT6H}
      GMAIL_SCHEDULER_INITIAL_DELAY: ${GMAIL_SCHEDULER_INITIAL_DELAY:-PT5M}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Configure APP_ADMIN_USERNAME in .env.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Configure APP_ADMIN_PASSWORD in .env.local}
      EXTENSION_API_TOKEN: ${EXTENSION_API_TOKEN:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-PT8H}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
