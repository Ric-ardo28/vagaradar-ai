services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vagaradar
      POSTGRES_USER: ${DATABASE_USERNAME:-vagaradar}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vagaradar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vagaradar
      DATABASE_USERNAME: ${DATABASE_USERNAME:-vagaradar}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vagaradar}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
