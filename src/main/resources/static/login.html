<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso protegido ao VagaRadar AI">
  <title>Entrar · VagaRadar AI</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/login" aria-label="VagaRadar AI"><span class="brand-mark">VR</span><span>VagaRadar <strong>AI</strong></span></a>
    <p class="eyebrow">ACESSO PESSOAL</p>
    <h1>Entre no seu painel.</h1>
    <p class="login-copy">Este painel contém suas vagas, análises e conexão Gmail.</p>
    <p id="login-error" class="error login-error" hidden>Usuário ou senha inválidos.</p>
    <form id="login-form" method="post" action="/login">
      <input type="hidden" id="csrf-token" name="_csrf">
      <label>Usuário<input name="username" autocomplete="username" required autofocus></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-dark login-submit" type="submit">Entrar com segurança</button>
    </form>
  </main>
  <script src="/js/login.js" defer></script>
</body>
</html>
