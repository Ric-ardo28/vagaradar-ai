spring:
  application:
    name: vagaradar
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/vagaradar}
    username: ${DATABASE_USERNAME:vagaradar}
    password: ${DATABASE_PASSWORD:vagaradar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.readonly

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:PT8H}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  security:
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-5.6-terra}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  minimum-score: ${DISCORD_MINIMUM_SCORE:70}
  outbox:
    enabled: ${DISCORD_OUTBOX_ENABLED:true}
    fixed-delay: ${DISCORD_OUTBOX_FIXED_DELAY:PT30S}
    initial-delay: ${DISCORD_OUTBOX_INITIAL_DELAY:PT10S}

gmail:
  oauth-enabled: ${GMAIL_OAUTH_ENABLED:false}
  scheduler:
    enabled: ${GMAIL_SCHEDULER_ENABLED:false}
    fixed-delay: ${GMAIL_SCHEDULER_FIXED_DELAY:PT6H}
    initial-delay: ${GMAIL_SCHEDULER_INITIAL_DELAY:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
